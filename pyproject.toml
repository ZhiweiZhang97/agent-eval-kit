[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "agent-eval-kit"
version = "0.2.0"
description = "A lightweight, provider-agnostic regression evaluation toolkit for LLM agents and RAG applications."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
authors = [{name = "Zhiwei Zhang"}]
keywords = ["llm", "agent", "rag", "evaluation", "regression-testing", "ai-testing"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "License :: OSI Approved :: Apache Software License",
  "Operating System :: OS Independent",
]
dependencies = [
  "httpx>=0.27,<1",
  "PyYAML>=6.0,<7",
  "typer>=0.12,<1",
  "rich>=13.7,<15",
  "jsonschema>=4.23,<5",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
  "pytest-cov>=5,<7",
  "ruff>=0.6,<1",
  "build>=1.2,<2",
]

[project.scripts]
agent-eval = "agent_eval_kit.cli:app"

[project.urls]
Homepage = "https://github.com/ZhiweiZhang97/agent-eval-kit"
Issues = "https://github.com/ZhiweiZhang97/agent-eval-kit/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_eval_kit"]

[tool.pytest.ini_options]
pythonpath = ["src"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
